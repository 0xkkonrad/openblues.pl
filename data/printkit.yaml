    sheet: A4 sheet of 4 cards · 6 pages · black ink only
    note: >-
      The same five invitations at postcard size, for when you want to write something
      on the back before you give it to someone.
  - file: open-blues-2027-poster-a4.pdf
    preview: poster-a4.jpg
    title: Wall poster
    sheet: A4 · 6 pages, one per line · black ink only
    note: >-
      For the noticeboard at your studio or by the door at your local blues night.
      Ask whoever runs the place first. Prints just as well shrunk to A5.
