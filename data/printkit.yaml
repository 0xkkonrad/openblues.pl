      The ones to carry. Page 1 mixes all five invitations; each of the following pages
      is a sheet of one. Cut along the faint lines and keep a few in your jacket.
  - file: open-blues-2027-invite-cards-a6.pdf
    preview: invite-cards-a6.jpg
