# The downloadable print kit shown on /spread-the-word/ by the print-kit shortcode.
# file    -> static/files/printkit/<file>
# preview -> static/images/printkit/<preview>
# Regenerate with scripts/printkit/build.py in the openblues-2027 project repo.
items:
  - file: open-blues-2027-invite-cards-a7.pdf
