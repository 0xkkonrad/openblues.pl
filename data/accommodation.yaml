schema_version: 1
snapshot_at_utc: "2026-08-04T19:16:49Z"

# claim_key is the versioned Tally uniqueness key for an open place. Occupied
# places use non-claimable seed_v1 roster keys so participant data stays out of
# Git. The public picker reads occupancy keys only and never requests participant
# names. Other hidden fields are context only; they never bind a roster row.
claim_form:
  tally_form_id: "rjQKYM"
  fields:
    claim_key: "claim_key"
    spot_id: "spot_id"
    room: "room"
    place: "place"

roster:
  google_sheet_id: "1yOjUmU7gq6kY8cAurrMCKs9XVa86Ov-_uOTrTgAw8Bc"
  sheet_name: "Claims"
  # Launch safety gate: flip only after Tally -> Google Sheets OAuth has been
  # connected and a test claim is visible in the public Claims tab.
  integration_ready: true
  callback_name: "openBluesAccommodationRosterV1"
  request_timeout_ms: 10000
  poll_interval_ms: 30000

