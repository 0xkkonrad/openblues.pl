<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Castle downstairs accommodation map</title>
  <desc id="desc">A schematic ground-floor plan of the Castle. Wing A contains rooms A1, A2 and A3 around the kitchen and hall. Wing B contains rooms B1 and B2 beside the courtyard. Wing C contains room C1 below the entrance corridor.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2d2925; }
    .floor { fill: #fffaf1; }
    .shared { fill: #edf3e8; }
    .service { fill: #e3eef2; }
    .outside { fill: #f3ecdf; }
    .wall { fill: none; stroke: #312b26; stroke-width: 5; stroke-linejoin: round; }
    .divider { stroke: #312b26; stroke-width: 4; }
    .kicker { fill: #8f3f25; font-size: 23px; font-weight: 800; letter-spacing: 2.2px; }
    .note { fill: #6d6258; font-size: 23px; font-weight: 650; letter-spacing: .5px; }
    .room-code { fill: #fff; font-size: 30px; font-weight: 850; }
    .room-name { font-size: 23px; font-weight: 800; }
    .room-meta { fill: #594f46; font-size: 23px; font-weight: 650; }
    .space-name { fill: #45613f; font-size: 23px; font-weight: 800; }
    .space-meta { fill: #5e6f59; font-size: 23px; font-weight: 650; }
    .service-name { fill: #3e5e6d; font-size: 23px; font-weight: 800; }
    .pill { fill: #f8e4b5; stroke: #a96b17; stroke-width: 2.5; }
    .pill-sofa { fill: #dcebd4; stroke: #55704b; stroke-width: 2.5; }
    .pill-mattress { fill: #fff6df; stroke: #a96b17; stroke-width: 2.5; stroke-dasharray: 4 3; }
    .pill-text { fill: #4a371b; font-size: 23px; font-weight: 800; letter-spacing: .1px; }
    .pill-text-sofa { fill: #3d5637; font-size: 23px; font-weight: 800; letter-spacing: .1px; }
    .entry { fill: #8f3f25; font-size: 23px; font-weight: 850; }
  </style>
  <defs>
    <symbol id="single" viewBox="0 0 22 28">
      <rect x="3" y="2" width="16" height="24" rx="3" fill="#fffaf1" stroke="#7e5013" stroke-width="2.5"/>
      <rect x="5" y="4" width="12" height="6" rx="2" fill="#dfbd6b"/>
    </symbol>
    <symbol id="double" viewBox="0 0 30 28">
      <rect x="2" y="2" width="26" height="24" rx="3" fill="#fffaf1" stroke="#7e5013" stroke-width="2.5"/>
      <rect x="4" y="4" width="10" height="6" rx="2" fill="#dfbd6b"/>
      <rect x="16" y="4" width="10" height="6" rx="2" fill="#dfbd6b"/>
    </symbol>
    <symbol id="sofa" viewBox="0 0 30 24">
      <rect x="4" y="7" width="22" height="13" rx="4" fill="#eff6eb" stroke="#4f6847" stroke-width="2.5"/>
      <path d="M4 12H2V20H28V12H26M8 7V18M22 7V18" fill="none" stroke="#4f6847" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="mattress" viewBox="0 0 30 24">
      <rect x="2" y="4" width="26" height="17" rx="4" fill="#fffaf1" stroke="#8f641f" stroke-width="2.5" stroke-dasharray="3 2"/>
      <path d="M7 8H15M7 12H12" stroke="#c9973d" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="900" rx="24" fill="#fcf7ee"/>
  <text x="38" y="35" class="kicker">CASTLE · DOWNSTAIRS</text>
  <text x="1162" y="35" text-anchor="end" class="note">SCHEMATIC · NOT TO SCALE</text>

  <!-- Room and shared-space fields preserve the source plan's adjacencies. -->
  <rect x="36" y="68" width="450" height="260" class="floor"/>
  <rect x="36" y="328" width="450" height="183" class="floor"/>
  <rect x="486" y="68" width="276" height="250" class="shared"/>
  <rect x="486" y="318" width="276" height="193" class="shared"/>
  <rect x="762" y="68" width="402" height="356" class="floor"/>
  <rect x="762" y="424" width="402" height="201" class="floor"/>
  <rect x="762" y="625" width="402" height="239" class="floor"/>
  <rect x="36" y="617" width="450" height="247" class="floor"/>
  <rect x="36" y="511" width="450" height="106" fill="#fff"/>
  <rect x="486" y="511" width="276" height="353" class="outside"/>
  <rect x="486" y="272" width="94" height="108" rx="8" class="service"/>
  <rect x="36" y="617" width="90" height="82" class="service"/>

  <!-- Exterior and room boundaries; door swings are intentionally omitted. -->
  <rect x="36" y="68" width="1128" height="796" rx="3" class="wall"/>
  <path d="M486 68V511M762 68V864M36 328H486M762 424H1164M762 625H1164M36 511H486M36 617H486M486 511H762" class="divider"/>
  <rect x="486" y="272" width="94" height="108" rx="8" fill="none" stroke="#456777" stroke-width="3"/>
  <path d="M126 617V699H36" fill="none" stroke="#456777" stroke-width="3"/>

  <!-- A1 -->
  <g data-room="castle-downstairs-a1" transform="translate(62 92)">
    <rect width="64" height="42" rx="21" fill="#9b452a"/>
    <text x="32" y="29" text-anchor="middle" class="room-code">A1</text>
    <text x="0" y="72" class="room-name">Wing A · 4 places</text>
    <g transform="translate(0 91)"><rect width="340" height="42" rx="21" class="pill"/><use href="#double" x="10" y="7" width="28" height="28"/><text x="47" y="28" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
    <g transform="translate(0 141)"><rect width="340" height="42" rx="21" class="pill"/><use href="#single" x="12" y="7" width="22" height="28"/><text x="43" y="28" class="pill-text">2 SINGLES · 2 PLACES</text></g>
  </g>

  <!-- A2 -->
  <g data-room="castle-downstairs-a2" transform="translate(62 346)">
    <rect width="64" height="42" rx="21" fill="#9b452a"/>
    <text x="32" y="29" text-anchor="middle" class="room-code">A2</text>
    <text x="82" y="28" class="room-name">Wing A · 4 places</text>
    <g transform="translate(0 60)"><rect width="340" height="42" rx="21" class="pill"/><use href="#double" x="10" y="7" width="28" height="28"/><text x="47" y="28" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
    <g transform="translate(0 110)"><rect width="340" height="42" rx="21" class="pill"/><use href="#single" x="11" y="7" width="22" height="28"/><text x="42" y="28" class="pill-text">2 SINGLES · 2 PLACES</text></g>
  </g>

  <!-- Kitchen and hall -->
  <g transform="translate(624 170)" text-anchor="middle">
    <text class="space-name">Kitchen</text>
    <text y="27" class="space-meta">shared space</text>
  </g>
  <g transform="translate(624 434)" text-anchor="middle">
    <text class="space-name">Hall</text>
    <text y="30" class="space-meta">connects</text>
    <text y="58" class="space-meta">Wings A + B</text>
  </g>
  <text x="533" y="318" text-anchor="middle" class="service-name">WC</text>

  <!-- A3 -->
  <g data-room="castle-downstairs-a3" transform="translate(788 92)">
    <rect width="64" height="42" rx="21" fill="#9b452a"/>
    <text x="32" y="29" text-anchor="middle" class="room-code">A3</text>
    <text x="82" y="24" class="room-name">Wing A</text>
    <text x="82" y="51" class="room-meta">4 listed places</text>
    <g transform="translate(0 76)"><rect width="340" height="42" rx="21" class="pill"/><use href="#double" x="10" y="7" width="28" height="28"/><text x="47" y="28" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
    <g transform="translate(0 126)"><rect width="250" height="42" rx="21" class="pill-sofa"/><use href="#sofa" x="9" y="9" width="28" height="24"/><text x="45" y="28" class="pill-text-sofa">1 SINGLE SOFA</text></g>
    <g transform="translate(0 172)"><rect width="344" height="72" rx="30" class="pill-sofa"/><use href="#sofa" x="10" y="24" width="28" height="24"/><text x="48" y="30" class="pill-text-sofa">DOUBLE-SIZE SOFA</text><text x="48" y="58" class="pill-text-sofa">1 LISTED PLACE</text></g>
  </g>

  <!-- B1 -->
  <g data-room="castle-downstairs-b1" transform="translate(788 440)">
    <rect width="64" height="42" rx="21" fill="#9b452a"/>
    <text x="32" y="29" text-anchor="middle" class="room-code">B1</text>
    <text x="82" y="28" class="room-name">Wing B · 4 places</text>
    <g transform="translate(0 58)"><rect width="340" height="42" rx="21" class="pill"/><use href="#double" x="9" y="7" width="28" height="28"/><text x="44" y="28" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
    <g transform="translate(0 108)"><rect width="330" height="68" rx="29" class="pill-mattress"/><use href="#mattress" x="10" y="22" width="28" height="24"/><text x="46" y="29" class="pill-text">2 MATTRESSES</text><text x="46" y="56" class="pill-text">2 PLACES</text></g>
  </g>

  <!-- B2 -->
  <g data-room="castle-downstairs-b2" transform="translate(788 649)">
    <rect width="64" height="42" rx="21" fill="#9b452a"/>
    <text x="32" y="29" text-anchor="middle" class="room-code">B2</text>
    <text x="82" y="28" class="room-name">Wing B · 2 places</text>
    <g transform="translate(0 63)"><rect width="340" height="42" rx="21" class="pill"/><use href="#double" x="10" y="7" width="28" height="28"/><text x="47" y="28" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
  </g>

  <!-- C1 -->
  <g data-room="castle-downstairs-c1" transform="translate(138 644)">
    <rect width="64" height="42" rx="21" fill="#9b452a"/>
    <text x="32" y="29" text-anchor="middle" class="room-code">C1</text>
    <text x="82" y="28" class="room-name">Wing C · 4 places</text>
    <g transform="translate(0 63)"><rect width="340" height="42" rx="21" class="pill"/><use href="#double" x="10" y="7" width="28" height="28"/><text x="47" y="28" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
    <g transform="translate(0 113)"><rect width="340" height="42" rx="21" class="pill"/><use href="#single" x="12" y="7" width="22" height="28"/><text x="43" y="28" class="pill-text">2 SINGLES · 2 PLACES</text></g>
  </g>
  <text x="81" y="664" text-anchor="middle" class="service-name">WC</text>

  <g transform="translate(624 676)" text-anchor="middle">
    <text class="space-name">Courtyard</text>
    <text y="31" class="space-meta">open-air</text>
    <text y="59" class="space-meta">shared space</text>
  </g>
  <path d="M16 564H111" stroke="#9b452a" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 556L115 564L105 572" fill="none" stroke="#9b452a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="548" class="entry">ENTRANCE</text>
</svg>
