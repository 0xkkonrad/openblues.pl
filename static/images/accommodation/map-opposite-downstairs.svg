<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Opposite building downstairs accommodation map</title>
  <desc id="desc">A schematic plan with Room 1 on the image-left, a central hall, and Room 2 on the image-right. The entrance is on the lower edge near the hall and Room 2.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2d2925; }
    .floor { fill: #fffaf1; }
    .shared { fill: #edf3e8; }
    .wall { fill: none; stroke: #312b26; stroke-width: 5; stroke-linejoin: round; }
    .divider { stroke: #312b26; stroke-width: 4; }
    .kicker { fill: #8f3f25; font-size: 20px; font-weight: 850; letter-spacing: 2px; }
    .note { fill: #6d6258; font-size: 20px; font-weight: 650; }
    .room-code { fill: #fff; font-size: 34px; font-weight: 850; }
    .room-name { font-size: 25px; font-weight: 850; }
    .room-meta { fill: #594f46; font-size: 21px; font-weight: 700; }
    .space-name { fill: #45613f; font-size: 26px; font-weight: 850; }
    .pill { fill: #f8e4b5; stroke: #a96b17; stroke-width: 2.5; }
    .pill-text { fill: #4a371b; font-size: 20px; font-weight: 850; }
    .entry { fill: #8f3f25; font-size: 20px; font-weight: 850; }
  </style>
  <defs>
    <symbol id="single" viewBox="0 0 22 28">
      <rect x="3" y="2" width="16" height="24" rx="3" fill="#fffaf1" stroke="#7e5013" stroke-width="2.5"/>
      <rect x="5" y="4" width="12" height="6" rx="2" fill="#dfbd6b"/>
    </symbol>
    <symbol id="double" viewBox="0 0 30 28">
      <rect x="2" y="2" width="26" height="24" rx="3" fill="#fffaf1" stroke="#7e5013" stroke-width="2.5"/>
      <rect x="4" y="4" width="10" height="6" rx="2" fill="#dfbd6b"/>
      <rect x="16" y="4" width="10" height="6" rx="2" fill="#dfbd6b"/>
    </symbol>
  </defs>

  <rect width="1000" height="440" rx="24" fill="#fcf7ee"/>
  <text x="32" y="38" class="kicker">OPPOSITE · DOWNSTAIRS</text>
  <text x="968" y="38" text-anchor="end" class="note">SCHEMATIC · NOT TO SCALE</text>

  <rect x="32" y="68" width="360" height="318" class="floor"/>
  <rect x="392" y="68" width="228" height="318" class="shared"/>
  <rect x="620" y="68" width="348" height="318" class="floor"/>
  <rect x="32" y="68" width="936" height="318" rx="3" class="wall"/>
  <path d="M392 68V386M620 68V386" class="divider"/>

  <g data-room="opposite-downstairs-1" transform="translate(60 98)">
    <rect width="66" height="48" rx="24" fill="#9b452a"/>
    <text x="33" y="35" text-anchor="middle" class="room-code">1</text>
    <text x="84" y="32" class="room-name">Room 1</text>
    <text x="0" y="83" class="room-meta">2 person-places</text>
    <g transform="translate(0 108)"><rect width="302" height="46" rx="23" class="pill"/><use href="#double" x="12" y="9" width="30" height="28"/><text x="53" y="30" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
  </g>

  <g transform="translate(506 210)" text-anchor="middle">
    <text class="space-name">Hall</text>
  </g>

  <g data-room="opposite-downstairs-2" transform="translate(648 98)">
    <rect width="66" height="48" rx="24" fill="#9b452a"/>
    <text x="33" y="35" text-anchor="middle" class="room-code">2</text>
    <text x="84" y="32" class="room-name">Room 2</text>
    <text x="0" y="83" class="room-meta">3 person-places</text>
    <g transform="translate(0 108)"><rect width="302" height="46" rx="23" class="pill"/><use href="#double" x="12" y="9" width="30" height="28"/><text x="53" y="30" class="pill-text">1 DOUBLE · 2 PLACES</text></g>
    <g transform="translate(0 162)"><rect width="280" height="46" rx="23" class="pill"/><use href="#single" x="15" y="9" width="22" height="28"/><text x="49" y="30" class="pill-text">1 SINGLE · 1 PLACE</text></g>
  </g>

  <path d="M590 424V397" stroke="#9b452a" stroke-width="4" stroke-linecap="round"/>
  <path d="M581 406L590 397L599 406" fill="none" stroke="#9b452a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="574" y="430" text-anchor="end" class="entry">ENTRANCE</text>
</svg>
