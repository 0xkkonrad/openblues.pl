baseURL = "https://openblues.pl/"
locale = "en"
title = "Open Blues — DIY Blues & Fusion Dance Festival in Poland"

# Relative asset URLs so the site works both at
# 0xkkonrad.github.io/OpenBlues.pl (preview) and openblues.pl (after DNS cut-over).
# Canonical/og/sitemap URLs stay absolute on baseURL.
relativeURLs = true

disableKinds = ["taxonomy", "term", "rss", "section"]
enableGitInfo = false

[params]
  description = "A private, cost-shared, 100% DIY blues & fusion dance gathering at a historic Polish palace. Live music, community-run workshops, communal cooking. 27–31 August 2026."
  ogImage = "images/og-palace.jpg"
  registerURL = "https://forms.gle/Y9bHtPcDKLdtcGGj6"
  eventStart = "2026-08-27"
  eventEnd = "2026-08-31"
  eventDatesHuman = "27–31 August 2026"

[services.youtube]
  privacyEnhanced = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[minify]
  [minify.tdewolff.html]
    keepComments = false

[markup.goldmark.renderer]
  unsafe = true
