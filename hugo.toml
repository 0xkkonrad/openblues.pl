baseURL = "https://openblues.pl/"
locale = "en"
title = "Open Blues — DIY Blues & Fusion Dance Festival in Poland"

# Relative asset URLs so the site works both at
# 0xkkonrad.github.io/OpenBlues.pl (preview) and openblues.pl (after DNS cut-over).
# Canonical/og/sitemap URLs stay absolute on baseURL.
relativeURLs = true

disableKinds = ["taxonomy", "term", "rss", "section"]
enableGitInfo = false

[params]
  # --- Edition. Every date on the site (hero, at-a-glance, JSON-LD, Google Calendar link,
  # the generated .ics) derives from these three values. Change them here and nowhere else.
  eventStart = "2027-09-02"
  eventEnd = "2027-09-06"
  eventDatesHuman = "2–6 September 2027"
  # descriptionBase feeds <meta name=description>, og/twitter description and the JSON-LD
  # description; eventDatesHuman is appended to it at build time, so no date lives here.
  descriptionBase = "A private, cost-shared, 100% DIY blues & fusion dance gathering at a historic Polish palace. Live music, community-run workshops, communal cooking."
  ogImage = "images/og-palace.jpg"

  # --- Signups. While signupsOpen is false (or signupURL is empty) every signup button
  # renders as a non-link "Sign up · soon" state. To open signups: set signupURL to the Tally
  # form and signupsOpen = true. The button also closes itself while data/counter.json says
  # status = "cancelled".
  signupURL = "https://tally.so/r/Ek7V4o"
  signupsOpen = false

  # --- Change my details. The always-available self-service form people use to change anything
  # they answered at signup. /change/ is its permanent, public home: an email is lost within a
  # year, this URL is not. Deliberately NOT gated by signupsOpen — someone who signed up must be
  # able to change their details even after signups close.
  # changeOpen is the launch gate and the ONLY thing to flip. While it is false the /change/ page
  # and every change button degrade to an honest "· soon" state instead of shipping a link that
  # may 404. The form was still a draft during the 29 Aug 2026 verification run; it answers 200
  # as of 16:00 that day, so re-probe changeURL and set changeOpen = true at merge.
  changeURL = "https://tally.so/r/pbpaVZ"
  changeOpen = true

  # --- Threshold model. The gathering goes ahead once `threshold` people have paid the €50
  # Reservation Payment; if that is not reached by goNoGoDate it is cancelled and everyone is
  # refunded. The live count lives in data/counter.json (paid, threshold, status, updated),
  # written by .github/workflows/counter.yml from the published "Public" tab of the signups
  # workbook (repository variable COUNTER_CSV_URL) or edited by hand. There is NO capacity limit
  # and no "full" state: the counter has exactly three states, open | confirmed | cancelled, and
  # signups simply run until closeDate (POLICY.md, Fixed values, 29 Aug 2026).
  threshold = 40
  goNoGoDate = "2027-08-03"
  goNoGoHuman = "3 August 2027"
  closeDate = "2027-08-19"
  closeHuman = "19 August 2027"

  # --- Room browser (self-service accommodation Sheet for participants who paid
  # for a shared or single place). Empty until the 2027 Sheet is ready; same open/closed pattern.
  # roomBrowserURL must be the ROOM BROWSER tab URL ending in "#gid=<id>" (per-room links
  # append "&range=A5:E5"); roomBrowserInstructionsURL is the START HERE tab (optional).
  roomBrowserURL = ""
  roomBrowserInstructionsURL = ""

  # --- 2026 edition links kept on /2026/ for its participants (rendered by the archive-2026 shortcode).
  [params.archive2026]
    datesHuman = "27–31 August 2026"
    roomBrowserURL = "https://docs.google.com/spreadsheets/d/1Cu3Cgi5qpbeqUIpy87-dbzBTXIWrYuWIIHS5Jp1RSV8/edit#gid=2026080501"
    whatsappURL = "https://chat.whatsapp.com/FpBbIsZpV18LRja8wNhFdX"

[services.youtube]
  privacyEnhanced = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[minify]
  [minify.tdewolff.html]
    keepComments = false

[markup.goldmark.renderer]
  unsafe = true

# The iCal file is generated from eventStart/eventEnd (layouts/home.ics.ics).
[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.ICS]
  mediaType = "text/calendar"
  baseName = "openblues-2027"
  isPlainText = true

[outputs]
  home = ["HTML", "ICS"]
