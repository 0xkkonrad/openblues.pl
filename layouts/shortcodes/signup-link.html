{{- /* Inline text link to the signup form: {{< signup-link >}}the signup form{{< /signup-link >}} */ -}}
{{- $text := .Inner | default "the signup form" -}}
{{- if partial "signup-is-open.html" . -}}
<a href="{{ site.Params.signupURL }}">{{ $text }}</a>
{{- else -}}
{{ $text }} (not currently open)
{{- end -}}
