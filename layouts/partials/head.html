<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- $isHome := .IsHome }}
{{- $title := cond $isHome site.Title (printf "%s — Open Blues" .Title) }}
{{- $desc := .Params.description | default site.Params.description }}
<title>{{ $title }}</title>
<meta name="description" content="{{ $desc }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="theme-color" content="#e87511">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Open Blues">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ site.Params.ogImage | absURL }}">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $desc }}">
<meta name="twitter:image" content="{{ site.Params.ogImage | absURL }}">

<link rel="icon" href="{{ "images/favicon.png" | relURL }}" type="image/png">
<link rel="apple-touch-icon" href="{{ "images/apple-touch-icon.png" | relURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

{{- with resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ .RelPermalink }}">
{{- end }}

{{- if $isHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["Festival", "DanceEvent"],
  "name": "Open Blues 2026",
  "description": {{ site.Params.description | jsonify }},
  "startDate": "{{ site.Params.eventStart }}",
  "endDate": "{{ site.Params.eventEnd }}",
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "eventStatus": "https://schema.org/EventScheduled",
  "image": ["{{ site.Params.ogImage | absURL }}"],
  "location": {
    "@type": "Place",
    "name": "Piotrowice Nyskie Palace",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Piotrowice Nyskie",
      "addressRegion": "Opole Voivodeship",
      "addressCountry": "PL"
    }
  },
  "organizer": {
    "@type": "Organization",
    "name": "Open Blues",
    "url": "https://openblues.pl/"
  },
  "offers": {
    "@type": "Offer",
    "url": {{ site.Params.registerURL | jsonify }},
    "price": "120",
    "priceCurrency": "EUR",
    "availability": "https://schema.org/InStock"
  },
  "isAccessibleForFree": false,
  "url": "https://openblues.pl/"
}
</script>
{{- end }}
